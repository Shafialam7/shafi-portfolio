[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route /api/* requests to Netlify Serverless API Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Route /admin to Admin Dashboard
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Fallback SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
