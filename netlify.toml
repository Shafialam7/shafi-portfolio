[build]
  command = "npm run build"
  publish = "dist"

# Netlify Redirect Rules for SPA (Single Page Application)
[[redirects]]
  from = "/api/*"
  to = "https://shafi-chatbot-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://shafi-chatbot-backend.onrender.com/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
